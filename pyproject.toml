[project]
name = "hk-transport"
version = "0.1.0"
description = "An AI agent skill for Hong Kong public transport questions. MTR first."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "gnokit" }]
dependencies = [
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://github.com/gnokit/hk-transport"
Issues = "https://github.com/gnokit/hk-transport/issues"

[build-system]
requires = ["uv_build>=0.8.5,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
markers = [
    "live: calls the live MTR APIs and the monthly CSV",
]
addopts = "-m 'not live'"
