[project]
name = "hk-transport"
version = "0.1.0"
description = "An AI agent skill for Hong Kong public transport questions: MTR, franchised buses, green minibus, tram, ferry, and one journey across them."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "gnokit" }]
dependencies = [
    "ijson>=3.6.0",
    "networkx>=3.7",
    "pyproj>=3.7",
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://github.com/gnokit/hk-transport"
Issues = "https://github.com/gnokit/hk-transport/issues"

[build-system]
requires = ["uv_build>=0.8.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
markers = [
    "live: calls the live MTR APIs and the monthly CSV",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
